<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Номерная Лихорадка</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Шапка -->
        <header class="top-bar">
            <div class="stat-box">
                <span class="icon">🪙</span>
                <span id="coinCount">0</span>
            </div>
            <div class="stat-box">
                <span class="icon">🎰</span>
                <span id="spinCount">100</span>
            </div>
        </header>

        <!-- Игровой экран -->
        <main id="gameScreen">
            <div class="status-panel" id="statusPanel">
                <span id="statusText">Крути номер!</span>
                <span id="rarityText" class="rarity-common">Обычный</span>
            </div>

            <!-- Зона с номером (кликабельная) -->
            <div class="plate-wrapper" id="clickArea">
                <div class="plate" id="plateElement">
                    <div class="rivet top-left"></div>
                    <div class="rivet top-right"></div>
                    <div class="rivet bottom-left"></div>
                    <div class="rivet bottom-right"></div>
                    
                    <div class="plate-content">
                        <span id="pL1">A</span>
                        <span id="pNum">000</span>
                        <span id="pL2">A</span>
                        <span id="pL3">A</span>
                    </div>
                    <div class="plate-region">
                        <span id="pReg">77</span>
                        <span class="flag">RUS</span>
                    </div>
                </div>
                <div class="glow-effect" id="glowEffect"></div>
            </div>

            <button id="spinBtn" class="main-btn">Крутить!</button>
            <p class="hint">Жми на номер или кнопку. Можно кликать очень быстро!</p>
            
            <!-- Контейнер для всплывающих монет -->
            <div id="floatingContainer"></div>
        </main>

        <!-- Экран коллекции -->
        <main id="collectionScreen" class="hidden">
            <h2>Коллекция</h2>
            <div id="collectionGrid" class="collection-grid"></div>
        </main>

        <!-- Меню -->
        <nav class="bottom-nav">
            <button id="navGame" class="nav-btn active">🎰 Крутить</button>
            <button id="navColl" class="nav-btn">💼 Коллекция</button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
